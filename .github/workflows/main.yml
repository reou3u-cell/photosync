name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-generate Modules
        run: |
          rm -f go.mod go.sum || true
          go mod init photo-uploader
          go get fyne.io/fyne/v2@v2.4.3
          go get google.golang.org/api@v0.220.0
          go mod tidy

      - name: Fyne Android Build
        uses: fyne-io/fyne-action@v1
        with:
          os: android
          app-id: com.frost.photosync.v10
          name: PhotoSyncMobileAuto
