name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Auto-generate Modules
        run: |
          rm -f go.mod go.sum || true
          go mod init photo-uploader
          go get fyne.io/fyne/v2@v2.4.3
          go get google.golang.org/api@v0.220.0
          go mod tidy

      - name: Install fyne-cross
        run: go install ://github.com

      - name: Run Fyne-Cross Compilation
        run: |
          # Запускаем сборку через установленный fyne-cross
          fyne-cross android --pull=false -no-cache --app-id com.frost.photosync.v10 --name PhotoSyncMobileAuto .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-Android-APK
          path: ./fyne-cross/dist/android/PhotoSyncMobileAuto.apk
