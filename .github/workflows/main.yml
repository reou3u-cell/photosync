name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK inside Official Fyne Container
        run: |
          # Сервер запускает официальный мобильный образ Fyne и компилирует код из корня
          docker run --rm -v ${{ github.workspace }}:/app -w /app fyneio/fyne-cross-images:android sh -c "
            go mod tidy
            fyne-cross android --pull=false -no-cache --app-id com.frost.photosync.v10 --name PhotoSyncMobileAuto .
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-Android-APK
          path: ./fyne-cross/dist/android/PhotoSyncMobileAuto.apk
